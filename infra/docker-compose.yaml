name: library-demo

services:
  graphdb:
    image: ontotext/graphdb:11.5.0
    ports:
      - "127.0.0.1:7200:7200"
    environment:
      GDB_JAVA_OPTS: >-
        -Dgraphdb.home=/opt/graphdb/home
        -Dgraphdb.workbench.importDirectory=/opt/graphdb/import
    volumes:
      - graphdb-data:/opt/graphdb/home
      - ./graphdb/graphdb.license:/opt/graphdb/home/conf/graphdb.license:ro
      - ../vocab:/opt/graphdb/import/vocab:ro
      - ../data:/opt/graphdb/import/data:ro

  graphdb-loader:
    build:
      context: ./graphdb
      dockerfile: loader.Dockerfile
    profiles:
      - loader
    environment:
      GRAPHDB_URL: http://graphdb:7200
      REPOSITORY_ID: library-demo
      REPOSITORY_CONFIG: /config/repository-config.ttl
    volumes:
      - ./graphdb/repository-config.ttl:/config/repository-config.ttl:ro

  mcp:
    build:
      context: ..
      dockerfile: infra/mcp/Dockerfile
    depends_on:
      - graphdb
    environment:
      GRAPHDB_ENDPOINT: http://graphdb:7200/repositories/library-demo
    ports:
      - "127.0.0.1:8000:8000"

  langflow:
    image: langflowai/langflow:1.10.2@sha256:ae6f9afd03bc032dc2989ece49791fcf83871230aff9d6e485c8e1ebada1e70f
    depends_on:
      - mcp
    environment:
      LANGFLOW_HOST: 0.0.0.0
      LANGFLOW_CONFIG_DIR: /app/langflow
      LANGFLOW_AUTO_LOGIN: "true"
      LANGFLOW_CREATE_STARTER_PROJECTS: "false"
      LANGFLOW_UPDATE_STARTER_PROJECTS: "false"
    ports:
      - "127.0.0.1:7860:7860"
    volumes:
      - langflow-data:/app/langflow

volumes:
  graphdb-data:
  langflow-data:
